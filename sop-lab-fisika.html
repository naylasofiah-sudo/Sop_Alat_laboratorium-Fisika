  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Breadcrumb */
  .crumb { font-size: .82rem; color: #64748b; margin-bottom: 16px; }
  .crumb span { color: #2563eb; cursor: pointer; }
  .crumb span:hover { text-decoration: underline; }
  .crumb .sep { margin: 0 6px; color: #cbd5e1; }
  .crumb .now { color: #1f2937; font-weight: 600; cursor: default; }

  .search-box {
    width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1;
    border-radius: 10px; font-size: .95rem; margin-bottom: 20px; outline: none;
  }
  .search-box:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

  /* Grid kategori */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 18px; cursor: pointer; transition: .2s; position: relative;
  }
  .card:hover {
    border-color: #2563eb; box-shadow: 0 6px 18px rgba(37,99,235,.12);
    transform: translateY(-2px);
  }
  .card .num {
    display: inline-block; background: #dbeafe; color: #1e40af;
    font-weight: 700; font-size: .72rem; padding: 2px 8px;
    border-radius: 6px; margin-bottom: 8px;
  }
  .card h3 { font-size: 1rem; margin-bottom: 6px; }
  .card p { font-size: .8rem; color: #64748b; }
  .card .count {
    display: inline-block; margin-top: 8px; font-size: .72rem;
    color: #2563eb; font-weight: 600;
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto; z-index: 100;
  }
  .overlay.active { display: flex; }
  .modal {
    background: #fff; max-width: 780px; width: 100%;
    border-radius: 14px; padding: 24px 28px 32px;
    position: relative; animation: pop .2s ease;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .close {
    position: absolute; top: 12px; right: 14px; background: #f1f5f9;
    border: none; border-radius: 8px; width: 34px; height: 34px;
    font-size: 1.1rem; cursor: pointer; color: #475569;
  }
  .modal .close:hover { background: #e2e8f0; }
  .modal h2 { color: #1e3a8a; font-size: 1.2rem; margin-bottom: 4px; }
  .modal .sub { color: #64748b; font-size: .82rem; margin-bottom: 18px; }

  .section { margin-bottom: 16px; }
  .section h4 {
    display: flex; align-items: center; gap: 8px; font-size: .9rem;
    color: #1e40af; border-left: 4px solid #2563eb;
    padding-left: 10px; margin-bottom: 8px;
  }
  .section ol, .section ul { padding-left: 20px; font-size: .88rem; }
  .section li { margin-bottom: 5px; }
  .warning {
    background: #fef2f2; border: 1px solid #fecaca;
    border-left: 4px solid #dc2626; border-radius: 8px;
    padding: 12px 14px; font-size: .86rem; color: #991b1b;
  }
  .warning strong { color: #b91c1c; }

  /* Daftar alat dalam kategori */
  .tool-list { display: grid; gap: 10px; }
  .tool-item {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 14px 16px; cursor: pointer; transition: .2s;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .tool-item:hover { border-color: #2563eb; background: #f8fafc; }
  .tool-item .info h3 { font-size: .95rem; margin-bottom: 2px; }
  .tool-item .info p { font-size: .78rem; color: #64748b; }
  .tool-item .arrow { color: #94a3b8; font-size: 1.1rem; }

  footer { text-align: center; font-size: .76rem; color: #94a3b8; padding: 24px 16px; }
  @media (max-width: 480px) { .modal { padding: 18px 16px 24px; } }

/* ===================== NAVIGASI ===================== */
const view = document.getElementById('view');
const crumb = document.getElementById('crumb');
const search = document.getElementById('search');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

let state = { level: 'kategori', kategori: null };

function renderCrumb() {
  let html = '<span onclick="goKategori()">Kategori</span>';
  if (state.level === 'alat' && state.kategori) {
    html += '<span class="sep">›</span><span class="now">' + state.kategori + '</span>';
  }
  crumb.innerHTML = html;
}

function renderKategori(filter = '') {
  state = { level: 'kategori', kategori: null };
  renderCrumb();
  const cats = Object.keys(data).filter(c => c.toLowerCase().includes(filter.toLowerCase()));
  view.innerHTML = '<div class="grid">' + cats.map((c, i) => `
    <div class="card" onclick="bukaKategori('${c}')">
      <span class="num">Kategori ${i + 1}</span>
      <h3>${c}</h3>
      <p>${data[c].length} alat</p>
      <span class="count">Lihat alat →</span>
    </div>
  `).join('') + '</div>';
}

function bukaKategori(cat) {
  state = { level: 'alat', kategori: cat };
  renderCrumb();
  const items = data[cat];
  view.innerHTML = '<div class="tool-list">' + items.map((a, i) => `
    <div class="tool-item" onclick="bukaSOP('${cat}', ${i})">
      <div class="info">
        <h3>${a.nama}</h3>
        <p>${a.ringkas}</p>
      </div>
      <div class="arrow">›</div>
    </div>
  `).join('') + '</div>';
}

function goKategori() {
  state = { level: 'kategori', kategori: null };
  renderKategori(search.value);
}

function bukaSOP(cat, i) {
  const a = data[cat][i];
  modal.innerHTML = `
    <button class="close" onclick="closeSOP()">✕</button>
    <h2>${a.nama}</h2>
    <div class="sub">${cat} · Kode: ${a.kode}</div>

    <div class="section">
      <h4>🎯 Tujuan &amp; Fungsi Alat</h4>
      <p style="font-size:.88rem">${a.fungsi}</p>
    </div>

    <div class="section">
      <h4>⚠️ Keselamatan Kerja (K3) &amp; Peringatan</h4>
      <div class="warning">
        <ul style="padding-left:18px">${a.k3.map(x => `<li>${x}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="section">
      <h4>🧰 Prosedur Persiapan</h4>
      <ol>${a.persiapan.map(x => `<li>${x}</li>`).join('')}</ol>
    </div>

    <div class="section">
      <h4>▶️ Langkah Pengoperasian Alat</h4>
      <ol>${a.operasi.map(x => `<li>${x}</li>`).join('')}</ol>
    </div>

    <div class="section">
      <h4>📦 Penyimpanan &amp; Pemeliharaan</h4>
      <ol>${a.penyimpanan.map(x => `<li>${x}</li>`).join('')}</ol>
    </div>
  `;
  overlay.classList.add('active');
}

function closeSOP() { overlay.classList.remove('active'); }

overlay.addEventListener('click', e => { if (e.target === overlay) closeSOP(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSOP(); });

search.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (state.level === 'kategori') {
    renderKategori(q);
  } else {
    const items = data[state.kategori];
    const filtered = items.map((a, i) => ({ a, i })).filter(({ a }) =>
      a.nama.toLowerCase().includes(q) || a.ringkas.toLowerCase().includes(q)
    );
    view.innerHTML = '<div class="tool-list">' + filtered.map(({ a, i }) => `
      <div class="tool-item" onclick="bukaSOP('${state.kategori}', ${i})">
        <div class="info"><h3>${a.nama}</h3><p>${a.ringkas}</p></div>
        <div class="arrow">›</div>
      </div>
    `).join('') + '</div>';
  }
});

// init
renderKategori();
</script>
