<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Misteri Induksi Elektromagnetik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: dark lab stage (16:9 canvas) with controls, a five-scene rail and a caption block beneath. Single committed dark look. */
:root{
  --bg:#060a13; --panel:#0b1220; --line:#1b2a45; --fg:#e4f0ff; --muted:#8fa5c6;
  --blue:#2ee6ff; --orange:#ff8a1f; --yellow:#ffd43b;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:Inter,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.5;
  padding-block:12px;display:flex;align-items:center;justify-content:center;min-height:100dvh;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{width:min(100%,calc((100dvh - 24px)*16/9));max-width:1280px;margin:0 auto}
.eyebrow{margin:0;font:500 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
h1{margin:2px 0 0;font:700 clamp(22px,4vw,34px)/1.15 var(--font-display);text-wrap:balance}
.stage{position:relative;aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.stage canvas{display:block;width:100%;height:100%}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(3,6,12,.58);padding:16px;text-align:center}
.ovl p{margin:0;color:var(--muted);font-size:13px;max-width:420px}
button{font:500 13px var(--font-mono);letter-spacing:.04em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--blue)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.big{font:700 17px var(--font-display);letter-spacing:.02em;background:var(--orange);color:#1a0d00;border-color:var(--orange);padding:14px 26px;border-radius:4px}
button.big:hover{background:#ffa043}
button[aria-pressed="false"]{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .tc{font:500 13px var(--font-mono);color:var(--muted);min-width:112px;text-align:right}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--blue);height:40px}
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rail button{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;overflow:hidden}
.rail .rt{font:400 11px var(--font-mono);color:var(--muted)}
.rail .rn{font:700 14px var(--font-display);color:var(--fg)}
.rail .rp{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue)}
.rail button.on{border-color:var(--blue)}
.rail button.on .rt{color:var(--blue)}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.cap .lbl{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.cap p{margin:0}
#vo{font:500 clamp(16px,2.4vw,20px)/1.5 var(--font-display);max-width:68ch;text-wrap:pretty}
.meta{font:400 12px var(--font-mono);color:var(--muted)}
.hint{margin:0;font-size:12px;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Animasi 3D isometrik: magnet digerakkan keluar-masuk kumparan dan jarum galvanometer bergerak"></canvas>
    <div class="ovl" id="ovl" hidden>
      <button class="big" id="startBtn" type="button">Putar animasi 60 detik</button>
      <p id="ovlNote">Nyalakan suara perangkat untuk efek dan narasi bahasa Indonesia.</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const W=1280,H=720;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),bctx=buf.getContext('2d');
let DPR=1;
const FD='"Space Grotesk",system-ui,sans-serif',FM='"IBM Plex Mono",ui-monospace,monospace';
const BLUE='#2ee6ff',ORG='#ff8a1f',YEL='#ffd43b';
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const A=(t,a,b)=>sstep((t-a)/(b-a));
const rnd=x=>{const s=Math.sin(x*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------- scenes ---------- */
const SC=[
 {t0:0,t1:10,name:'Pancingan Visual',vo:'Coba perhatikan alat ini. Jarumnya bergerak ke kanan dan ke kiri. Ini tandanya ada arus listrik yang mengalir.',sfx:'Klik mekanik jarum galvanometer',tone:'antusias dan penasaran',v0:0.8,v1:9.6,pitch:1.1},
 {t0:10,t1:20,name:'Konflik Kognitif',vo:'Tapi tunggu... di meja ini sama sekali tidak ada baterai. Tidak ada sumber listrik. Lalu, dari mana arus ini berasal?',sfx:'Bling! saat tanda tanya muncul',tone:'bingung, sedikit dramatis',v0:10.4,v1:19.4,pitch:1.0},
 {t0:20,t1:35,name:'Aksi Magnet',vo:'Ternyata, listrik muncul saat magnet ini digerakkan! Ketika digerakkan cepat, jarumnya bergerak jauh. Saat digerakkan lambat, jarumnya hanya bergerak sedikit. Kenapa bisa begitu?',sfx:'Swoosh saat magnet didorong',tone:'mulai memahami pola',v0:20.3,v1:34.5,pitch:1.05},
 {t0:35,t1:45,name:'Magnet Diam',vo:'Tapi, kalau magnetnya didiamkan saja di dalam kumparan... jarumnya berhenti bergerak. Berarti, listrik tidak dihasilkan oleh magnetnya. Lalu, apa yang sebenarnya berubah?',sfx:'Musik latar meredup',tone:'penuh tanda tanya',v0:35.3,v1:44.6,pitch:0.95},
 {t0:45,t1:60,name:'Seruan Bertindak',vo:'Inilah misteri Induksi Elektromagnetik. Hari ini, kita akan membongkar rahasia Hukum Faraday, Hukum Lenz, dan bagaimana prinsip ini menggerakkan seluruh peradaban kita. Siap menyelidiki?',sfx:'Musik latar naik, membangun semangat',tone:'mengajak dan memotivasi',v0:45.5,v1:59.0,pitch:1.1}
];
const sceneOf=t=>{for(let i=0;i<SC.length;i++)if(t<SC[i].t1)return i;return SC.length-1};

/* ---------- physics (pure functions of time) ---------- */
const OUT=2.4;
function dxAt(t){
  if(t<10) return OUT/2+OUT/2*Math.cos(Math.PI*t);
  let d=OUT;
  d-=OUT*sstep((t-21.0)/0.7);   // fast in
  d+=OUT*sstep((t-22.4)/0.7);   // fast out
  d-=OUT*sstep((t-27.0)/3.3);   // slow in
  return d;
}
function needleAt(t){
  const e=0.02,v=(dxAt(t+e)-dxAt(t-e))/(2*e);
  return clamp(-v*8,-55,55);
}
function peak(a,b){let m=0;for(let x=a;x<=b;x+=0.02)m=Math.max(m,Math.abs(needleAt(x)));return m}
const PF=peak(21,22),PS=peak(27,30.5);

/* ---------- camera ---------- */
const KF=[[0,-1.2,.2,.9,78],[3,-1.2,.2,.9,84],[7.5,-3.5,1,1.15,185],[10,-3.5,1,1.15,188],[13.5,0,.1,.6,75],[20,.2,.1,.6,77],[22.5,-1,0,.6,88],[35,-1,0,.6,90],[45,.5,-.3,.8,98],[60,0,0,.7,82]];
let CAM={fx:0,fy:0,fz:0,s:80};
function camAt(t){
  for(let i=0;i<KF.length-1;i++){
    const a=KF[i],b=KF[i+1];
    if(t<=b[0]){const k=sstep((t-a[0])/(b[0]-a[0]));return{fx:lerp(a[1],b[1],k),fy:lerp(a[2],b[2],k),fz:lerp(a[3],b[3],k),s:lerp(a[4],b[4],k)}}
  }
  const l=KF[KF.length-1];return{fx:l[1],fy:l[2],fz:l[3],s:l[4]};
}
function P(x,y,z){
  const dx=x-CAM.fx,dy=y-CAM.fy,dz=z-CAM.fz;
  return [W/2+(dx-dy)*0.866*CAM.s, H/2+(dx+dy)*0.5*CAM.s-dz*CAM.s];
}

/* ---------- drawing primitives ---------- */
function poly(pts,fill,stroke,lw){
  ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}
}
function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function box(x0,x1,y0,y1,z0,z1,cT,cS,cE,st){
  poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],cT,st,1);
  poly([P(x0,y1,z1),P(x1,y1,z1),P(x1,y1,z0),P(x0,y1,z0)],cS,st,1);
  poly([P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0),P(x1,y0,z0)],cE,st,1);
}
function T(s,x,y,size,color,o){
  o=o||{};
  ctx.save();
  ctx.globalAlpha=o.a==null?1:o.a;
  ctx.font=(o.w||700)+' '+size+'px '+(o.f||FD);
  ctx.textAlign=o.al||'center';
  ctx.textBaseline=o.bl||'alphabetic';
  if('letterSpacing' in ctx)ctx.letterSpacing=(o.ls||0)+'px';
  ctx.fillStyle=color;
  if(o.g){ctx.shadowColor=o.gc||color;ctx.shadowBlur=o.g}
  ctx.fillText(s,x,y);
  ctx.restore();
}

/* ---------- world ---------- */
const C={x:1.2,y:-1,z:0.95};
const GX=-3.6,GY=1,GZ=1.3,GR=0.8;

function drawBackground(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070d1b');g.addColorStop(1,'#03060c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.6);
  rg.addColorStop(0,'rgba(46,230,255,0.10)');rg.addColorStop(1,'rgba(46,230,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(46,230,255,0.10)';ctx.lineWidth=1;
  for(let i=-14;i<=14;i+=2){line(P(i,-14,-.5),P(i,14,-.5));line(P(-14,i,-.5),P(14,i,-.5))}
  for(let i=0;i<40;i++){
    const x=(rnd(i)*W+t*(6+rnd(i+3)*10))%W,y=(rnd(i+9)*H-t*(3+rnd(i+5)*6)+H*3)%H;
    ctx.fillStyle=(i%3?'rgba(46,230,255,':'rgba(255,138,31,')+(0.15+0.25*Math.abs(Math.sin(t*1.5+i)))+')';
    ctx.fillRect(x,y,1.6,1.6);
  }
}
function drawTable(){
  const X=5.4,Y=3,Th=.35;
  poly([P(-X,Y,0),P(X,Y,0),P(X,Y,-Th),P(-X,Y,-Th)],'#0a1426','rgba(46,230,255,.35)',1.2);
  poly([P(X,-Y,0),P(X,Y,0),P(X,Y,-Th),P(X,-Y,-Th)],'#08101f','rgba(46,230,255,.35)',1.2);
  poly([P(-X,-Y,0),P(X,-Y,0),P(X,Y,0),P(-X,Y,0)],'#0e1a32');
  ctx.strokeStyle='rgba(46,230,255,.07)';ctx.lineWidth=1;
  for(let i=-5;i<=5;i++)line(P(i,-Y,0),P(i,Y,0));
  for(let j=-3;j<=3;j++)line(P(-X,j,0),P(X,j,0));
  ctx.save();ctx.shadowColor=BLUE;ctx.shadowBlur=14;
  poly([P(-X,-Y,0),P(X,-Y,0),P(X,Y,0),P(-X,Y,0)],null,'rgba(46,230,255,.8)',1.6);
  ctx.restore();
  // coil cradles
  box(C.x-.8,C.x-.5,C.y-.3,C.y+.3,0,.17,'#1c2f58','#14244a','#101c3a','rgba(46,230,255,.5)');
  box(C.x+.5,C.x+.8,C.y-.3,C.y+.3,0,.17,'#1c2f58','#14244a','#101c3a','rgba(46,230,255,.5)');
}
function drawPedestal(){
  box(GX-.7,GX+.7,GY-.5,GY+.5,0,.4,'#16264a','#0f1c38','#0c1730','rgba(46,230,255,.5)');
  const s=CAM.s;
  [[GX+.7,GY-.25,BLUE],[GX+.7,GY+.25,ORG]].forEach(a=>{
    const p=P(a[0],a[1],.2);ctx.fillStyle=a[2];ctx.beginPath();ctx.arc(p[0],p[1],.06*s,0,7);ctx.fill();
  });
}
const WIRES=[
  [[C.x-.6,C.y,.13],[C.x-.6,C.y,.03],[-2.5,C.y,.03],[-2.5,.75,.03],[GX+.7,.75,.2]],
  [[GX+.7,1.25,.2],[-2.5,1.25,.03],[C.x+.6,1.25,.03],[C.x+.6,C.y,.03],[C.x+.6,C.y,.13]]
];
function drawWires(th,t){
  const s=CAM.s;
  const dir=th>0?1:-1,inten=clamp(Math.abs(th)/35,0,1);
  WIRES.forEach((w,wi)=>{
    const pts=w.map(p=>P(p[0],p[1],p[2]));
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    ctx.shadowColor=ORG;ctx.shadowBlur=8;ctx.strokeStyle='#e8863a';ctx.lineWidth=Math.max(1.5,.035*s);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.restore();
    if(Math.abs(th)>1.5){
      const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
      const tot=L[L.length-1];
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor=BLUE;ctx.shadowBlur=10;ctx.fillStyle='rgba(120,240,255,'+(0.35+.65*inten)+')';
      for(let k=0;k<7;k++){
        let u=((t*0.9*dir)+k/7)%1;if(u<0)u+=1;
        const d=u*tot;let i=1;while(i<L.length-1&&L[i]<d)i++;
        const f=(d-L[i-1])/Math.max(1e-6,L[i]-L[i-1]);
        const x=lerp(pts[i-1][0],pts[i][0],f),y=lerp(pts[i-1][1],pts[i][1],f);
        ctx.beginPath();ctx.arc(x,y,.045*s,0,7);ctx.fill();
      }
      ctx.restore();
    }
  });
}
function coil(part){
  const N=9,r=.82,s=CAM.s;
  ctx.save();ctx.lineCap='round';
  if(part==='front'){ctx.shadowColor=ORG;ctx.shadowBlur=9;ctx.strokeStyle='#ffa24d';ctx.lineWidth=Math.max(1.5,.055*s)}
  else{ctx.strokeStyle='rgba(190,100,30,.7)';ctx.lineWidth=Math.max(1.2,.045*s)}
  const a0=part==='front'?-Math.PI/4:3*Math.PI/4,a1=part==='front'?3*Math.PI/4:7*Math.PI/4;
  for(let i=0;i<N;i++){
    const x=C.x-.6+i*(1.2/(N-1));
    ctx.beginPath();
    for(let k=0;k<=20;k++){
      const a=lerp(a0,a1,k/20),p=P(x,C.y+r*Math.cos(a),C.z+r*Math.sin(a));
      k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawMagnet(dx){
  const cx=C.x+dx,y0=C.y-.36,y1=C.y+.36,z0=C.z-.36,z1=C.z+.36,s=CAM.s;
  const c=P(cx,C.y,C.z),g=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],s*1.7);
  g.addColorStop(0,'rgba(255,160,70,.16)');g.addColorStop(1,'rgba(255,160,70,0)');
  ctx.fillStyle=g;ctx.fillRect(c[0]-s*2,c[1]-s*2,s*4,s*4);
  box(cx-1,cx,y0,y1,z0,z1,'#ffb35c','#ff8a1f','#c76a12','rgba(255,255,255,.35)');
  box(cx,cx+1,y0,y1,z0,z1,'#7fdcff','#1fb6ff','#1a8ccc','rgba(255,255,255,.35)');
  // push rod
  const a=P(cx+1,C.y,C.z),b=P(cx+1.8,C.y,C.z);
  ctx.save();ctx.lineCap='round';ctx.strokeStyle='#8fa6c8';ctx.lineWidth=.09*s;line(a,b);
  ctx.shadowColor=ORG;ctx.shadowBlur=12;ctx.fillStyle=ORG;ctx.beginPath();ctx.arc(b[0],b[1],.16*s,0,7);ctx.fill();ctx.restore();
}
function poleLabels(dx){
  const cx=C.x+dx,s=CAM.s,z=C.z+.36+.3;
  const n=P(cx-.5,C.y,z),sp=P(cx+.5,C.y,z);
  T('N',n[0],n[1],.32*s,ORG,{g:10,f:FM});
  T('S',sp[0],sp[1],.32*s,BLUE,{g:10,f:FM});
}
function fluxDisc(alpha){
  if(alpha<=.01)return;
  const r=.82;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();
  for(let k=0;k<=36;k++){const a=k/36*Math.PI*2,p=P(C.x,C.y+r*Math.cos(a),C.z+r*Math.sin(a));k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
  ctx.closePath();ctx.fillStyle='rgba(46,230,255,.10)';ctx.fill();
  ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(46,230,255,.8)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.restore();
}
function field(dx,alpha){
  if(alpha<=.01)return;
  const cx=C.x+dx,s=CAM.s;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=Math.max(1,.02*s);ctx.strokeStyle='rgba(46,230,255,'+(alpha*.85)+')';ctx.shadowColor=BLUE;ctx.shadowBlur=8;
  const phis=[0,Math.PI/3,2*Math.PI/3];
  [[1.45,.75],[2.0,1.15]].forEach(ab=>{
    phis.forEach(ph=>{
      ctx.beginPath();
      for(let k=0;k<=48;k++){
        const u=k/48*Math.PI*2,r=ab[1]*Math.sin(u),p=P(cx+ab[0]*Math.cos(u),C.y+r*Math.cos(ph),C.z+r*Math.sin(ph));
        k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
      }
      ctx.stroke();
    });
  });
  ctx.setLineDash([7,6]);
  [[-.18,0],[.18,0],[0,.18],[0,-.18],[0,0]].forEach(o=>line(P(cx-1.5,C.y+o[0],C.z+o[1]),P(cx+1.5,C.y+o[0],C.z+o[1])));
  ctx.restore();
}
function drawGauge(th,t){
  const s=CAM.s,R=GR*s,p=P(GX,GY,GZ),px=p[0],py=p[1];
  ctx.save();ctx.translate(px,py);
  const glow=clamp(Math.abs(th)/40,0,1),rg=ctx.createRadialGradient(0,0,0,0,0,R*2.2);
  rg.addColorStop(0,'rgba(255,138,31,'+(.05+.18*glow)+')');rg.addColorStop(1,'rgba(255,138,31,0)');
  ctx.fillStyle=rg;ctx.fillRect(-R*2.4,-R*2.4,R*4.8,R*4.8);

    synth.cancel();
    const s=SC[i],u=new SpeechSynthesisUtterance(s.vo);
    u.lang='id-ID';if(voice)u.voice=voice;
    u.rate=clamp(s.vo.length/((s.v1-s.v0)*14),.85,1.35);u.pitch=s.pitch;
    synth.speak(u);
  }catch(e){}
}

/* ---------- timeline events ---------- */
const EV=[];
const ev=(t,f)=>EV.push({t:t,f:f});
ev(.55,()=>sfx.glitch());
for(let k=0;k<9;k++)ev(1.5+k,()=>sfx.click());
ev(9.9,()=>sfx.glitch());
ev(13.0,()=>sfx.blip());
ev(14.0,()=>sfx.bling());
ev(19.9,()=>sfx.glitch());
ev(21.0,()=>sfx.swoosh(.7,.7));
ev(22.4,()=>sfx.swoosh(.7,.7));
ev(27.0,()=>sfx.swoosh(3.2,.25));
ev(34.8,()=>sfx.thud());
ev(36.0,()=>sfx.blip());
ev(44.2,()=>sfx.riser());
ev(44.9,()=>sfx.glitch());
ev(46.0,()=>sfx.stab());
SC.forEach((s,i)=>ev(s.v0,()=>speak(i)));
function fire(a,b){
  if(b-a>.5)return;
  for(const e of EV)if(e.t>a&&e.t<=b){try{e.f()}catch(_){}}
}

/* ---------- player ---------- */
let t=0,playing=false,started=false,ended=false,dirty=true,lastNow=0,curScene=-1;
const $=id=>document.getElementById(id);
const ovl=$('ovl'),startBtn=$('startBtn'),stage=$('stage');


function start(keep){
  started=true;ovl.hidden=true;
  ended=false;playing=true;ensureAudio();dirty=true;
}
function begin(){seek(0);start()}
function seek(x){
  t=clamp(x,0,59.99);ended=false;
  try{synth&&synth.cancel()}catch(e){}
  if(!started){started=true;ovl.hidden=true}
  dirty=true;
}
function showPause(){ovl.hidden=false;startBtn.textContent='Lanjutkan';$('ovlNote').textContent='Dijeda. Klik layar untuk melanjutkan.'}
function toggle(){
  if(!started||ended){begin();return}
  playing=!playing;
  if(playing){ovl.hidden=true;ensureAudio();try{synth&&narOn&&synth.resume()}catch(e){}}
  else{showPause();try{synth&&synth.pause()}catch(e){}}
  dirty=true;
}
startBtn.addEventListener('click',e=>{e.stopPropagation();if(!started||ended)begin();else toggle()});
stage.addEventListener('click',()=>{if(skipClick){skipClick=false;return}if(started&&!ended)toggle()});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&(e.target===document.body)){e.preventDefault();toggle()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&playing){playing=false;showPause();try{synth&&synth.pause()}catch(e){}dirty=true}
});

function updateUI(){}
function frame(now){
  requestAnimationFrame(frame);
  if(playing){
    const dt=Math.min(.1,(now-lastNow)/1000),prev=t;
    t+=dt;
    if(t>=60){
      t=60;playing=false;ended=true;
      ovl.hidden=false;startBtn.textContent='Putar ulang';$('ovlNote').textContent='Animasi selesai.';
    }
    fire(prev,t);
    if(AC&&musicGain)musicGain.gain.setTargetAtTime(playing?musicLevel(t):0,AC.currentTime,.25);
    dirty=true;
  }else if(AC&&musicGain){
    musicGain.gain.setTargetAtTime(0,AC.currentTime,.15);
  }
  lastNow=now;
  if(dirty){
    dirty=false;
    render(ended?56:(started?t:15.4));
    updateUI();
  }
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  buf.width=cv.width;buf.height=cv.height;dirty=true;
}
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true});
let unlocked=false,skipClick=false;
function unlock(e){
  if(unlocked)return;
  unlocked=true;
  if(e&&(e.type==='pointerdown'||e.type==='touchstart')){skipClick=true;setTimeout(()=>{skipClick=false},500)}
  ensureAudio();
  if(playing){const i=sceneOf(t),s=SC[i];if(t>=s.v0&&t<s.v1-2.5)speak(i)}
}
['pointerdown','touchstart','keydown'].forEach(n=>window.addEventListener(n,unlock,{passive:true}));
started=true;playing=true;ensureAudio();
requestAnimationFrame(frame);
})();
</script>
